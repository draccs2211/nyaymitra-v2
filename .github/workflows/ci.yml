name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      APP_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Install dependencies (CPU torch)
        run: |
          TORCH_VERSION=$(grep -E '^torch==' requirements.lock | cut -d= -f3)
          pip install "torch==${TORCH_VERSION}+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock

      - name: Load legal corpus
        run: python -m backend.data_loader

      - name: Tests (no paid APIs)
        run: pytest -m "not paid" -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t nyaymitra-api:ci .
      - name: Image contains runtime data (templates, DLSA directory, helplines)
        run: >
          docker run --rm --entrypoint python nyaymitra-api:ci -c
          "from backend.templates import load_templates;
          from backend.mcp_servers.dlsa_mcp import lookup_dlsa, load_helplines;
          assert len(load_templates()) == 5;
          assert lookup_dlsa('Lucknow');
          assert load_helplines();
          print('runtime data OK')"
