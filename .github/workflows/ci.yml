name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Install dependencies (CPU torch)
        run: |
          TORCH_VERSION=$(grep -E '^torch==' requirements.lock | cut -d= -f3)
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock

      - name: Load legal corpus
        run: python -m backend.data_loader

      - name: Tests (no paid APIs)
        run: pytest -m "not paid" -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nyaymitra-api:ci .
